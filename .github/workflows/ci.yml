name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: samesync_owner
          # Throwaway credentials for the CI service container only.
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: samesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samesync_owner -d samesync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://samesync_owner:ci_only_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Safety suite
        run: pnpm test:safety

      - name: Content check
        run: pnpm content:check

      - name: Content launch coverage
        run: pnpm content:check --launch

      - name: Build
        run: pnpm build
